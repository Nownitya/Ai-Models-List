name: Matrix Parity & CI Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Dual-Matrix Parity, Skills Quality & Test Pyramid
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1. Validate Dual-Matrix Parity (Law 1 Gate)
        run: |
          python scripts/sync-matrix.py

      - name: 2. Run Skill Quality & Link Audit (Law 2 Gate)
        run: |
          python scripts/test-skills.py

      - name: 3. Verify Cryptographic Lockfile (SHA-256 Gate)
        run: |
          python scripts/verify-lock.py

      - name: 4. Execute Full Unit Test Suite (33+ Tests)
        run: |
          python -m unittest discover tests "test_*.py" -v

      - name: 5. Verify MCP Server & Toolchain
        run: |
          python -c "
          from scripts.mcp_server import MCPServer
          server = MCPServer()
          res = server.search_skills('writing-plans')
          assert 'writing-plans' in res, 'MCP Server search verification failed!'
          metrics = server.get_upstream_metrics('agentskills')
          assert 'agentskills' in metrics, 'MCP Server telemetry verification failed!'
          print('[OK] MCP Server verified successfully!')
          "

      - name: 6. Verify Catalog Threshold (228+ SKILL.md packages)
        run: |
          python -c "
          from pathlib import Path
          skills = list(Path('skills').rglob('SKILL.md'))
          print(f'Total structured skills verified: {len(skills)}')
          assert len(skills) >= 228, f'Skill catalog verification failed! Found only {len(skills)}'
          print('[OK] Full catalog threshold satisfied!')
          "

      - name: 7. Set up Node.js & Verify React 19 Build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build React Application
        run: |
          cd web
          npm install
          npm run build


