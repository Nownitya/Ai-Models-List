name: Sync Upstream Metrics

on:
  schedule:
    # Run daily at 00:00 UTC (Completely free in public repos)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AI-Coding-Skills-and-Tools-Matrix.md'

permissions:
  contents: write

jobs:
  sync-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Live GitHub Metrics & Update Radar Table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync-github-metrics.py

      - name: Validate Dual Matrix Parity
        run: |
          python scripts/sync-matrix.py

      - name: Commit and Push Metrics Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check for changes in data/ and docs/LIVE-STATS.md
          if [ -n "$(git status --porcelain data/ docs/LIVE-STATS.md)" ]; then
            git add data/ docs/LIVE-STATS.md
            git commit -m "chore(metrics): update upstream stars and release versions [skip ci]"
            git push origin main
            echo "Metrics successfully updated and pushed."
          else
            echo "No metrics changes detected. Working tree clean."
          fi
