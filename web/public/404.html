<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AI Coding Skills Matrix — Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: converts deep path into query string for index.html
      var pathSegmentsToKeep = 1; // 1 segment for /Ai-Models-List/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to AI Coding Skills Matrix...</p>
  </body>
</html>
