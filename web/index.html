<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Coding Skills & Tools Matrix — React 19 Interactive Catalog</title>
    <meta name="description" content="Authoritative catalog of 317+ AI coding skills, agent harnesses, memory frameworks, and developer tools across 12 functional domains with live upstream telemetry." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- OpenGraph SEO / Social sharing -->
    <meta property="og:title" content="AI Coding Skills & Tools Matrix" />
    <meta property="og:description" content="Interactive catalog of 317+ AI coding skills, agent harnesses, memory frameworks, and MCP developer tools." />
    <meta property="og:type" content="website" />

    <!-- GitHub Pages Single-Page App Hash/Query Redirect Restore -->
    <script type="text/javascript">
      // Intercept redirected path from 404.html if present
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[#090d16] text-slate-100 min-h-screen">
    <div id="root">
      <!-- Semantic crawl fallback before JS hydration -->
      <noscript>
        <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
          <h1>AI Coding Skills & Tools Matrix</h1>
          <p>Authoritative catalog of 317+ AI coding skills, agent harnesses, and developer tools. Please enable JavaScript to access the interactive matrix.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
